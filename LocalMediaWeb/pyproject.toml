[project]
name = "localmediaweb"
version = "0.1.0"
description = "Local media aggregation browser with LAN web UI and extension ingest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0.2",
  "pillow>=11.0.0",
  "aiofiles>=24.1.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.uv]
package = false
