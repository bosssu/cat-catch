[project]
name = "appcatch"
version = "0.1.0"
description = "Windows desktop media catcher → LocalMediaWeb"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "pywin32>=306; sys_platform == 'win32'",
  "yt-dlp>=2024.1",
]

[project.scripts]
appcatch = "app.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
