<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>服务器媒体管理 · LocalMediaWeb</title>
  <link rel="stylesheet" href="css/public.css" />
  <link rel="stylesheet" href="css/lmw-media-manage.css?v=20261022subview1" />
  <script src="js/init.js"></script>
  <script src="js/function.js"></script>
  <script src="js/local-media-web.js?v=20261022subview1"></script>
</head>
<body class="mm-body">
  <header class="mm-header">
    <div class="mm-header-top">
      <div class="mm-brand">
        <div class="mm-title">服务器媒体管理</div>
        <div class="mm-conn">
          <span id="mmBase" class="mm-base muted"></span>
          <span id="mmHealth" class="mm-health" title="服务健康">…</span>
        </div>
      </div>
      <div class="mm-header-actions">
        <button type="button" id="btnSeriesPick" class="button2" title="按点击顺序把多条媒体标记为一部剧集">选择剧集</button>
        <button type="button" id="btnSeriesPickCancel" class="button2" hidden title="退出选剧，不提交">取消</button>
        <button type="button" id="btnOpenFeed" class="button2" title="在浏览器打开 LocalMediaWeb Feed">打开 Feed</button>
        <button type="button" id="btnRefresh" class="button2" title="刷新列表">刷新</button>
      </div>
    </div>

    <div class="mm-toolbar">
      <input type="search" id="mmQ" class="mm-input mm-search" placeholder="搜索标题 / URL / 标签" autocomplete="off" />
      <div class="mm-filters">
        <select id="mmType" class="mm-select" title="类型">
          <option value="">全部类型</option>
          <option value="video">视频</option>
          <option value="audio">音频</option>
          <option value="image">图片</option>
          <option value="gif">动图</option>
          <option value="series">剧集</option>
        </select>
        <select id="mmTag" class="mm-select" title="标签">
          <option value="">全部标签</option>
        </select>
        <select id="mmLiked" class="mm-select" title="喜欢">
          <option value="">喜欢不限</option>
          <option value="1">仅喜欢</option>
          <option value="0">未喜欢</option>
        </select>
        <select id="mmSort" class="mm-select" title="排序">
          <option value="new">最新</option>
          <option value="old">最旧</option>
        </select>
        <select id="mmPreviewMode" class="mm-select" title="预览模式">
          <option value="normal">普通</option>
          <option value="large">大预览</option>
          <option value="detail">详细信息</option>
        </select>
      </div>
    </div>

    <!-- 上传区：左侧居中拖放提示 + 右侧纵向控件 -->
    <div class="mm-upload" id="mmDrop">
      <div class="mm-upload-layout">
        <div class="mm-upload-drop">
          <div class="mm-upload-drop-top">
            <div class="mm-upload-icon" aria-hidden="true">⬇</div>
            <div class="mm-upload-title">拖放文件到此处</div>
            <div class="muted mm-drop-hint">或右侧选择本地文件 · 可多次叠加 · 同名同大小队列去重 · 库内内容相同则跳过</div>
            <div id="mmUploadProg" class="mm-upload-prog muted"></div>
          </div>
          <div class="mm-tag-combos" id="mmTagCombos" aria-label="常用标签组合">
            <div class="mm-tag-combos-head">
              <span class="mm-tag-combos-title">常用标签组合</span>
              <span class="muted mm-tag-combos-hint">点击复制 · 可填入右侧标签框</span>
            </div>
            <div class="mm-tag-combos-list" id="mmTagCombosList">
              <span class="muted mm-tag-combos-empty">加载中…</span>
            </div>
          </div>
        </div>
        <div class="mm-upload-side">
          <label class="button2 mm-file-label">
            选择文件
            <input type="file" id="mmFiles" multiple accept="video/*,audio/*,image/*,.mp4,.webm,.mkv,.mov,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.gif,.png,.jpg,.jpeg,.webp" hidden />
          </label>
          <input type="text" id="mmUploadTags" class="mm-input mm-upload-tags" placeholder="本批标签" autocomplete="off" spellcheck="false" />
          <label class="mm-check mm-check-restricted" title="本批上传打上「限制级」标签">
            <input type="checkbox" id="mmRestricted" />
            限制级
          </label>
          <div class="mm-upload-actions">
            <button type="button" id="btnUpload" class="button2 primary" disabled>上传</button>
            <button type="button" id="btnClearPending" class="button2" disabled title="清空当前待上传列表">清除</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mm-batch" id="mmBatchBar">
      <div class="mm-batch-left">
        <span id="mmSelCount" class="mm-sel-count">已选 0</span>
        <button type="button" id="btnSelPage" class="button2 ghost">全选本页</button>
        <button type="button" id="btnMarkSeries" class="button2 ghost" title="勾选一条已在剧里的条目，标出同一部剧的全部集">标记同剧</button>
        <button type="button" id="btnSelClear" class="button2 ghost">清除选择</button>
        <span class="muted mm-sel-hint" title="先点选一项作为起点，再按住 Shift 点击另一项，选中中间全部">Shift+点击 连续选</span>
      </div>
      <div class="mm-batch-right">
        <input type="text" id="mmBatchTags" class="mm-input mm-batch-tags" placeholder="批量标签…" autocomplete="off" spellcheck="false" />
        <button type="button" id="btnBatchMerge" class="button2">合并标签</button>
        <button type="button" id="btnBatchReplace" class="button2">覆盖标签</button>
        <!-- 去码请用本机 FFmpegBridge → JasnaBridge；服务端默认不跑 jasna -->
        <button type="button" id="btnDedupe" class="button2" title="扫描库内文件内容（SHA-256）完全相同的条目，每组仅保留一条并删除其余">一键去重</button>
        <button type="button" id="btnDownloadSel" class="button2" title="把勾选的视频下载到本机（Chrome 下载目录），不打开预览">下载选中</button>
        <button type="button" id="btnBatchDel" class="button2 danger">批量删除</button>
      </div>
      <span id="mmStatus" class="mm-status muted"></span>
    </div>
    <div id="mmJobStatus" class="mm-job-status" hidden></div>
  </header>

  <main class="mm-main">
    <div id="mmGrid" class="mm-grid" aria-live="polite"></div>
    <div class="mm-footer">
      <button type="button" id="btnSeriesBack" class="button2" hidden>返回剧集</button>
      <button type="button" id="btnMore" class="button2" disabled>加载更多</button>
      <span id="mmCount" class="muted">0 / 0</span>
    </div>
  </main>

  <!-- 预览 -->
  <div id="mmPreview" class="mm-preview hide" aria-hidden="true">
    <button type="button" id="mmPreviewClose" class="mm-preview-close" aria-label="关闭">×</button>
    <div class="mm-preview-stage" id="mmPreviewStage"></div>
    <div class="mm-preview-meta" id="mmPreviewMeta"></div>
  </div>

  <!-- 编辑 -->
  <div id="mmEdit" class="mm-modal hide" aria-hidden="true">
    <div class="mm-modal-card" role="dialog" aria-labelledby="mmEditTitle">
      <div class="mm-modal-head" id="mmEditTitle">编辑媒体</div>
      <label class="mm-field">标题
        <input type="text" id="mmEditTitleInput" class="mm-input" maxlength="500" />
      </label>
      <label class="mm-field">标签（逗号分隔，输入时从标签库联想）
        <input type="text" id="mmEditTagsInput" class="mm-input" autocomplete="off" spellcheck="false" />
      </label>
      <div class="mm-modal-actions">
        <button type="button" id="mmEditCancel" class="button2">取消</button>
        <button type="button" id="mmEditSave" class="button2 primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 字幕浏览 -->
  <div id="mmSubView" class="mm-modal hide" aria-hidden="true">
    <div class="mm-modal-card mm-subview-card" role="dialog" aria-labelledby="mmSubViewTitle">
      <div class="mm-modal-head" id="mmSubViewTitle">字幕浏览</div>
      <pre id="mmSubViewBody" class="mm-subview-body"></pre>
      <div class="mm-modal-actions">
        <button type="button" id="mmSubViewClose" class="button2">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/lmw-media-manage.js?v=20261022subview1"></script>
</body>
</html>
